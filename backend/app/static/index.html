<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mission Control — AI Agent Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-alt: #171b24;
    --border: #212633;
    --text: #dce1ea;
    --text-muted: #6e7686;
    --text-dim: #454c5c;
    --accent: #4dd8c4;
    --accent-dim: rgba(77, 216, 196, 0.14);
    --amber: #f0a93e;
    --amber-dim: rgba(240, 169, 62, 0.14);
    --green: #4ade80;
    --green-dim: rgba(74, 222, 128, 0.14);
    --red: #f0556b;
    --red-dim: rgba(240, 85, 107, 0.14);
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--accent-dim); color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; overflow: hidden; }

  /* subtle scanline / grid texture on the base background */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(77,216,196,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,216,196,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 20% 0%, #000 0%, transparent 70%);
  }

  a { color: inherit; }
  button { font-family: inherit; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 340px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    z-index: 1;
    height: 100vh;
  }

  .brand {
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark { display: flex; align-items: center; gap: 10px; }
  .brand-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .brand-title {
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .brand-sub {
    font-size: 12px; color: var(--text-muted); margin-top: 4px;
  }

  .composer { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .composer textarea {
    width: 100%; resize: vertical; min-height: 64px; max-height: 160px;
    background: var(--panel-alt); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-family: var(--sans); font-size: 13.5px; line-height: 1.45;
    outline: none;
  }
  .composer textarea::placeholder { color: var(--text-dim); }
  .composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .composer-row { display: flex; justify-content: flex-end; margin-top: 10px; }

  .btn {
    font-family: var(--mono); font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 5px; border: 1px solid transparent;
    cursor: pointer; transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #06110f; }
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }
  .btn-ghost {
    background: transparent; color: var(--text-muted); border-color: var(--border);
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-muted); }
  .btn:focus-visible, textarea:focus-visible, .mission-card:focus-visible, details summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .missions-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 8px;
  }
  .missions-head span {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: var(--text-muted); text-transform: uppercase;
  }
  .refresh-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 4px;
  }
  .refresh-btn:hover { color: var(--accent); }
  .refresh-btn.spinning { animation: spin 0.7s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .missions-list { flex: 1; overflow-y: auto; padding: 0 12px 16px; }
  .missions-list::-webkit-scrollbar { width: 8px; }
  .missions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .mission-card {
    width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
    border-radius: 8px; padding: 11px 12px; margin-bottom: 4px; cursor: pointer;
    display: block; color: inherit;
  }
  .mission-card:hover { background: var(--panel-alt); }
  .mission-card.active { background: var(--panel-alt); border-color: var(--border); }
  .mission-card.active::before { content: ""; }
  .mc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .mc-prompt {
    font-size: 13px; line-height: 1.4; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mc-meta {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 6px;
  }

  .empty-sidebar {
    padding: 30px 20px; text-align: center; color: var(--text-dim); font-size: 12.5px; line-height: 1.6;
  }

  /* status pill, shared */
  .pill {
    font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 100px;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; }
  .pill.pending { background: var(--amber-dim); color: var(--amber); }
  .pill.pending::before { background: var(--amber); }
  .pill.running { background: var(--accent-dim); color: var(--accent); }
  .pill.running::before { background: var(--accent); animation: breathe 1.2s ease-in-out infinite; }
  .pill.done { background: var(--green-dim); color: var(--green); }
  .pill.done::before { background: var(--green); }
  .pill.failed { background: var(--red-dim); color: var(--red); }
  .pill.failed::before { background: var(--red); }

  /* ---------- Main ---------- */
  .main { flex: 1; overflow-y: auto; z-index: 1; height: 100vh; }
  .main::-webkit-scrollbar { width: 10px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  .main-inner { max-width: 860px; margin: 0 auto; padding: 40px 44px 80px; }

  .placeholder {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-dim); text-align: center; gap: 10px;
  }
  .placeholder .glyph {
    font-family: var(--mono); font-size: 34px; color: var(--text-dim); letter-spacing: 0.1em;
  }
  .placeholder p { font-size: 13.5px; max-width: 320px; line-height: 1.6; margin: 0; }

  .mhead { border-bottom: 1px solid var(--border); padding-bottom: 22px; margin-bottom: 26px; }
  .mhead-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .mhead-id { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  .mhead-prompt { font-size: 19px; font-weight: 500; line-height: 1.45; margin: 0 0 16px; color: var(--text); }
  .mhead-actions { display: flex; align-items: center; gap: 10px; }
  .mhead-created { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

  .section-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); margin: 30px 0 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .empty-main {
    border: 1px dashed var(--border); border-radius: 10px; padding: 26px;
    color: var(--text-dim); font-size: 13px; line-height: 1.6; text-align: center;
  }

  /* ---- run block ---- */
  .run {
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    margin-bottom: 18px; overflow: hidden;
  }
  .run-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--panel-alt);
  }
  .run-head-left { display: flex; align-items: center; gap: 10px; }
  .run-id { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .run-times { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

  .run-body { padding: 18px 18px 6px; }

  /* signature element: the signal trace */
  .trace { position: relative; padding-left: 26px; }
  .trace-node {
    position: relative; padding-bottom: 20px;
  }
  .trace-node::before {
    /* connecting line */
    content: ""; position: absolute; left: -20px; top: 14px; bottom: -6px; width: 1px;
    background: var(--border);
  }
  .trace-node:last-child::before { display: none; }
  .trace-dot {
    position: absolute; left: -24px; top: 3px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .trace-dot.error { background: var(--red); box-shadow: 0 0 0 3px var(--red-dim); }

  .trace-node summary {
    list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 10px;
    font-family: var(--mono); font-size: 12.5px; color: var(--text);
  }
  .trace-node summary::-webkit-details-marker { display: none; }
  .trace-node summary .tool-name { font-weight: 600; }
  .trace-node summary .chev {
    color: var(--text-dim); font-size: 10px; transition: transform 0.15s ease; margin-left: auto;
  }
  .trace-node[open] summary .chev { transform: rotate(90deg); }
  .trace-node summary .ts { color: var(--text-dim); font-size: 10.5px; }

  .trace-payload {
    margin-top: 10px; display: grid; gap: 8px;
  }
  .payload-block {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px;
  }
  .payload-block .k {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 5px;
  }
  .payload-block pre {
    margin: 0; font-family: var(--mono); font-size: 12px; color: var(--text-muted);
    white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  .payload-block.err pre { color: var(--red); }

  .report-block {
    margin: 4px 0 16px; padding: 14px 16px; background: var(--bg);
    border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0;
  }
  .report-block .k {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
  }
  .report-block p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }

  .run-pending-note {
    font-size: 12.5px; color: var(--text-dim); padding: 4px 0 14px; font-style: italic;
  }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(0);
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 50;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast.error { border-color: var(--red); color: var(--red); }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; max-height: 46vh; border-right: none; border-bottom: 1px solid var(--border); }
    .main { height: auto; }
    .main-inner { padding: 26px 18px 60px; }
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-dot"></div>
        <div class="brand-title">Mission Control</div>
      </div>
      <div class="brand-sub">AI Agent Operations Platform</div>
    </div>

    <div class="composer">
      <textarea id="new-prompt" placeholder="Décris la mission à confier à l'agent…"></textarea>
      <div class="composer-row">
        <button class="btn btn-primary" id="create-btn">Créer la mission</button>
      </div>
    </div>

    <div class="missions-head">
      <span>Missions</span>
      <button class="refresh-btn" id="refresh-btn" title="Rafraîchir">⟳</button>
    </div>
    <div class="missions-list" id="missions-list">
      <div class="empty-sidebar">Chargement…</div>
    </div>
  </aside>

  <main class="main">
    <div id="main-content">
      <div class="placeholder">
        <div class="glyph">&gt;_</div>
        <p>Sélectionne une mission à gauche, ou crée-en une nouvelle pour voir l'agent travailler ici.</p>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>
const API = ""; // même origine que l'UI, on appelle directement /missions/...
const missionsListEl = document.getElementById("missions-list");
const mainContentEl = document.getElementById("main-content");
const toastEl = document.getElementById("toast");

let missions = [];
let selectedId = null;
let pollTimer = null;

const STATUS_LABEL = { pending: "En attente", running: "En cours", done: "Terminée", failed: "Échec" };

function showToast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => { toastEl.className = "toast"; }, 3200);
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function shortId(id) { return id ? id.slice(0, 8) : "—"; }

function pill(status) {
  return `<span class="pill ${status}">${STATUS_LABEL[status] || status}</span>`;
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function loadMissions({ silent = false } = {}) {
  const btn = document.getElementById("refresh-btn");
  if (!silent) btn.classList.add("spinning");
  try {
    missions = await api("/missions/");
    renderMissionsList();
    if (selectedId) {
      const stillSelected = missions.some(m => m.id === selectedId);
      if (stillSelected) await renderMissionDetail(selectedId, { silent: true });
    }
  } catch (e) {
    missionsListEl.innerHTML = `<div class="empty-sidebar">Impossible de contacter l'API.<br>${e.message}</div>`;
  } finally {
    if (!silent) setTimeout(() => btn.classList.remove("spinning"), 400);
  }
}

function renderMissionsList() {
  if (missions.length === 0) {
    missionsListEl.innerHTML = `<div class="empty-sidebar">Aucune mission pour l'instant.<br>Crée la première ci-dessus.</div>`;
    return;
  }
  missionsListEl.innerHTML = missions.map(m => `
    <button class="mission-card ${m.id === selectedId ? "active" : ""}" data-id="${m.id}">
      <div class="mc-top">${pill(m.status)}</div>
      <div class="mc-prompt">${escapeHtml(m.prompt)}</div>
      <div class="mc-meta">${shortId(m.id)} · ${fmtTime(m.created_at)}</div>
    </button>
  `).join("");

  missionsListEl.querySelectorAll(".mission-card").forEach(card => {
    card.addEventListener("click", () => selectMission(card.dataset.id));
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

async function selectMission(id) {
  selectedId = id;
  renderMissionsList();
  await renderMissionDetail(id);
}

async function renderMissionDetail(id, { silent = false } = {}) {
  const mission = missions.find(m => m.id === id);
  if (!mission) return;

  let runs = [];
  try {
    runs = await api(`/missions/${id}/runs`);
  } catch (e) {
    if (!silent) showToast("Erreur en chargeant l'historique : " + e.message, true);
  }

  const isRunning = mission.status === "running";

  mainContentEl.innerHTML = `
    <div class="main-inner">
      <div class="mhead">
        <div class="mhead-top">
          ${pill(mission.status)}
          <span class="mhead-id">${mission.id}</span>
        </div>
        <p class="mhead-prompt">${escapeHtml(mission.prompt)}</p>
        <div class="mhead-actions">
          <button class="btn btn-primary" id="run-btn" ${isRunning ? "disabled" : ""}>
            ${isRunning ? "Exécution en cours…" : "Lancer l'agent"}
          </button>
          <span class="mhead-created">créée le ${fmtTime(mission.created_at)}</span>
        </div>
      </div>

      <div class="section-label">Historique des exécutions</div>
      ${runs.length === 0 ? `
        <div class="empty-main">Aucune exécution pour l'instant. Lance la mission pour voir la trace de l'agent apparaître ici — chaque outil appelé, dans l'ordre, puis le rapport final.</div>
      ` : runs.map(renderRun).join("")}
    </div>
  `;

  const runBtn = document.getElementById("run-btn");
  if (runBtn) runBtn.addEventListener("click", () => launchRun(id));

  if (isRunning) startPolling(); else stopPolling();
}

function renderRun(run) {
  const trace = run.tool_calls.length
    ? `<div class="trace">${run.tool_calls.map(renderToolCall).join("")}</div>`
    : (run.status === "pending" || run.status === "running"
        ? `<div class="run-pending-note">L'agent réfléchit, aucun outil appelé pour l'instant…</div>`
        : `<div class="run-pending-note">L'agent a répondu directement, sans appeler d'outil.</div>`);

  const report = run.report
    ? `<div class="report-block"><div class="k">Rapport final</div><p>${escapeHtml(run.report.content)}</p></div>`
    : "";

  return `
    <div class="run">
      <div class="run-head">
        <div class="run-head-left">${pill(run.status)}<span class="run-id">run ${shortId(run.id)}</span></div>
        <div class="run-times">${fmtTime(run.started_at)} → ${run.finished_at ? fmtTime(run.finished_at) : "…"}</div>
      </div>
      <div class="run-body">
        ${trace}
        ${report}
      </div>
    </div>
  `;
}

function renderToolCall(tc) {
  const hasError = !!tc.error;
  return `
    <details class="trace-node">
      <span class="trace-dot ${hasError ? "error" : ""}"></span>
      <summary>
        <span class="tool-name">${escapeHtml(tc.tool_name)}</span>
        <span class="ts">${fmtTime(tc.created_at)}</span>
        <span class="chev">▶</span>
      </summary>
      <div class="trace-payload">
        <div class="payload-block">
          <div class="k">Entrée</div>
          <pre>${escapeHtml(prettyJson(tc.input_payload))}</pre>
        </div>
        ${tc.output_payload ? `
          <div class="payload-block">
            <div class="k">Sortie</div>
            <pre>${escapeHtml(tc.output_payload)}</pre>
          </div>` : ""}
        ${hasError ? `
          <div class="payload-block err">
            <div class="k">Erreur</div>
            <pre>${escapeHtml(tc.error)}</pre>
          </div>` : ""}
      </div>
    </details>
  `;
}

function prettyJson(raw) {
  try { return JSON.stringify(JSON.parse(raw), null, 2); }
  catch (_) { return raw; }
}

async function launchRun(id) {
  const btn = document.getElementById("run-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Exécution en cours…"; }
  try {
    await api(`/missions/${id}/run`, { method: "POST" });
    showToast("Mission terminée.");
  } catch (e) {
    showToast("L'agent a échoué : " + e.message, true);
  } finally {
    await loadMissions({ silent: true });
  }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => loadMissions({ silent: true }), 2500);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

document.getElementById("create-btn").addEventListener("click", async () => {
  const ta = document.getElementById("new-prompt");
  const prompt = ta.value.trim();
  if (!prompt) { showToast("Écris une mission avant de la créer.", true); return; }
  const btn = document.getElementById("create-btn");
  btn.disabled = true;
  try {
    const mission = await api("/missions/", { method: "POST", body: JSON.stringify({ prompt }) });
    ta.value = "";
    await loadMissions({ silent: true });
    await selectMission(mission.id);
    showToast("Mission créée.");
  } catch (e) {
    showToast("Erreur : " + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("refresh-btn").addEventListener("click", () => loadMissions());

loadMissions();
</script>
</body>
</html>
